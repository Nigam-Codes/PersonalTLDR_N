<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="TLDR Intelligence — a personal terminal for scanning, filtering and saving the world's most important news across technology, markets, science and geopolitics.">
<meta name="color-scheme" content="dark light">
<title>TLDR Intelligence</title>
<style>
/* ============================================================
   TLDR INTELLIGENCE — self-contained personal news terminal
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{
  color-scheme:dark;
  --bg:#0A0C10; --bg-2:#0d1017; --panel:#12151c; --panel-2:#171b24;
  --raise:#1c212c; --line:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.12);
  --txt:#eef2f7; --txt-2:#9aa4b4; --txt-3:#5f6a7d;
  --cyan:#38bdf8; --cyan-2:#22d3ee; --emerald:#34d399; --navy:#1e3a5f;
  --amber:#fbbf24; --violet:#a78bfa; --rose:#fb7185; --up:#34d399; --down:#fb7185;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -12px rgba(0,0,0,.55);
  --shadow-lg:0 24px 60px -18px rgba(0,0,0,.7);
  --r-sm:9px; --r:14px; --r-lg:20px; --r-xl:26px;
  --glass:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.01));
  --focus:0 0 0 2px var(--bg),0 0 0 4px var(--cyan);
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,Roboto,sans-serif;
  --nav-w:262px; --rail-w:344px; --maxc:1560px;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#eef1f6; --bg-2:#e7ebf2; --panel:#ffffff; --panel-2:#f7f9fc;
  --raise:#eef2f8; --line:rgba(12,20,40,.08); --line-strong:rgba(12,20,40,.14);
  --txt:#0d1626; --txt-2:#516074; --txt-3:#8c98ab;
  --navy:#dbe7f7;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 14px 34px -16px rgba(20,40,80,.22);
  --shadow-lg:0 26px 60px -20px rgba(20,40,80,.28);
  --glass:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.55));
  --focus:0 0 0 2px var(--panel),0 0 0 4px var(--cyan);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#eef1f6; --bg-2:#e7ebf2; --panel:#ffffff; --panel-2:#f7f9fc;
    --raise:#eef2f8; --line:rgba(12,20,40,.08); --line-strong:rgba(12,20,40,.14);
    --txt:#0d1626; --txt-2:#516074; --txt-3:#8c98ab; --navy:#dbe7f7;
    --shadow:0 1px 2px rgba(20,30,60,.06),0 14px 34px -16px rgba(20,40,80,.22);
    --shadow-lg:0 26px 60px -20px rgba(20,40,80,.28);
    --glass:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.55));
    --focus:0 0 0 2px var(--panel),0 0 0 4px var(--cyan);
  }
}
body{
  margin:0;font-family:var(--sans);color:var(--txt);
  background:
    radial-gradient(1100px 620px at 12% -8%,rgba(56,189,248,.10),transparent 60%),
    radial-gradient(1000px 640px at 108% 4%,rgba(52,211,153,.08),transparent 58%),
    radial-gradient(900px 700px at 60% 120%,rgba(167,139,250,.06),transparent 60%),
    var(--bg);
  background-attachment:fixed;min-height:100vh;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  line-height:1.5;letter-spacing:.1px;
}
::selection{background:rgba(56,189,248,.28)}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font-family:inherit}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:8px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
/* scrollbars */
*{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:20px}
*::-webkit-scrollbar-thumb:hover{background:var(--txt-3)}
*::-webkit-scrollbar-track{background:transparent}

/* ---------- shell / grid ---------- */
.app{max-width:var(--maxc);margin:0 auto;display:grid;
  grid-template-columns:var(--nav-w) minmax(0,1fr) var(--rail-w);
  gap:0;align-items:start}
.hide{display:none!important}

/* ---------- left nav ---------- */
.nav{position:sticky;top:0;height:100vh;overflow-y:auto;overflow-x:hidden;
  padding:20px 14px 26px;border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:6px;
  background:linear-gradient(180deg,rgba(255,255,255,.02),transparent 30%)}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px;margin-bottom:4px}
.brand .mark{width:38px;height:38px;border-radius:11px;flex:none;position:relative;
  background:conic-gradient(from 140deg,var(--cyan),var(--emerald),var(--violet),var(--cyan));
  box-shadow:0 6px 18px -4px rgba(56,189,248,.5);display:grid;place-items:center}
.brand .mark::after{content:"";position:absolute;inset:5px;border-radius:7px;background:var(--bg-2)}
.brand .mark svg{position:relative;z-index:1;width:18px;height:18px;stroke:var(--txt)}
.brand b{font-size:15px;font-weight:750;letter-spacing:.2px;display:block;line-height:1.15}
.brand span{font-size:11px;color:var(--txt-2);letter-spacing:2.4px;text-transform:uppercase;font-weight:600}
.nav-sec{font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--txt-3);
  font-weight:700;padding:16px 10px 7px}
.nav-item{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:10px;
  font-size:13.5px;font-weight:550;color:var(--txt-2);position:relative;
  transition:background .16s,color .16s,transform .1s;width:100%;text-align:left}
.nav-item svg{width:17px;height:17px;stroke-width:1.9;flex:none;opacity:.92}
.nav-item .dot{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.nav-item:hover{background:var(--panel);color:var(--txt)}
.nav-item.on{background:linear-gradient(90deg,rgba(56,189,248,.16),rgba(56,189,248,.04));
  color:var(--txt);box-shadow:inset 0 0 0 1px rgba(56,189,248,.22)}
.nav-item.on::before{content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);
  width:3px;height:20px;border-radius:0 3px 3px 0;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.nav-item .count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--txt-3);
  background:var(--panel-2);padding:1px 7px;border-radius:20px;font-variant-numeric:tabular-nums}
.nav-item.on .count{color:var(--cyan)}
.tag-wrap{display:flex;flex-wrap:wrap;gap:6px;padding:6px 8px 2px}
.tag-chip{font-family:var(--mono);font-size:11.5px;padding:4px 9px;border-radius:8px;
  background:var(--panel-2);color:var(--txt-2);border:1px solid var(--line);
  transition:.15s;display:inline-flex;align-items:center;gap:5px}
.tag-chip:hover{color:var(--txt);border-color:var(--line-strong);transform:translateY(-1px)}
.tag-chip.on{background:linear-gradient(180deg,rgba(167,139,250,.22),rgba(167,139,250,.08));
  color:#e9e2ff;border-color:rgba(167,139,250,.4)}
:root[data-theme="light"] .tag-chip.on{color:#5b3fc4}
.tag-chip .x{opacity:0;width:0;overflow:hidden;transition:.15s;color:var(--rose)}
.tag-chip:hover .x{opacity:.7;width:11px}
.add-tag{width:100%;margin:8px 8px 0;width:calc(100% - 16px);padding:7px;border-radius:9px;
  border:1px dashed var(--line-strong);color:var(--txt-2);font-size:12px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.add-tag:hover{color:var(--cyan);border-color:var(--cyan)}
.nav-foot{margin-top:auto;padding:14px 10px 2px;font-size:10.5px;color:var(--txt-3);
  display:flex;align-items:center;gap:8px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:40;padding:14px 22px;
  display:flex;align-items:center;gap:14px;
  background:color-mix(in srgb,var(--bg) 72%,transparent);
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  border-bottom:1px solid var(--line)}
.search{flex:1;position:relative;min-width:0}
.search>svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;stroke:var(--txt-3);pointer-events:none}
.search input{width:100%;height:46px;padding:0 96px 0 44px;border-radius:13px;
  background:var(--panel);border:1px solid var(--line);color:var(--txt);font-size:14px;
  transition:.18s;box-shadow:var(--shadow)}
.search input::placeholder{color:var(--txt-3)}
.search input:focus{border-color:rgba(56,189,248,.5);background:var(--panel-2);
  box-shadow:0 0 0 4px rgba(56,189,248,.12)}
.kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:11px;color:var(--txt-3);
  border:1px solid var(--line);border-radius:6px;padding:2px 7px;background:var(--panel-2)}
.top-actions{display:flex;align-items:center;gap:9px;flex:none}
.icon-btn{width:44px;height:44px;border-radius:12px;background:var(--panel);
  border:1px solid var(--line);display:grid;place-items:center;position:relative;
  transition:.16s;box-shadow:var(--shadow)}
.icon-btn svg{width:19px;height:19px;stroke:var(--txt-2);stroke-width:1.9}
.icon-btn:hover{transform:translateY(-1px);border-color:var(--line-strong)}
.icon-btn:hover svg{stroke:var(--txt)}
.badge{position:absolute;top:7px;right:7px;min-width:16px;height:16px;padding:0 4px;
  border-radius:9px;background:var(--rose);color:#fff;font-size:10px;font-weight:700;
  display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg);font-family:var(--mono)}
.avatar{width:44px;height:44px;border-radius:12px;flex:none;
  background:linear-gradient(135deg,#2b3a55,#38bdf8);display:grid;place-items:center;
  font-weight:750;font-size:14px;color:#fff;border:1px solid var(--line-strong);
  box-shadow:var(--shadow)}
.brief-btn{height:44px;padding:0 18px;border-radius:12px;font-weight:650;font-size:13.5px;
  color:#04121b;display:flex;align-items:center;gap:8px;white-space:nowrap;
  background:linear-gradient(135deg,var(--cyan),var(--cyan-2) 60%,var(--emerald));
  box-shadow:0 8px 22px -8px rgba(56,189,248,.6);transition:.16s}
.brief-btn svg{width:17px;height:17px;stroke:#04121b;stroke-width:2.2;fill:none}
.brief-btn:hover{transform:translateY(-1px);filter:brightness(1.06)}

/* ---------- center column ---------- */
.center{min-width:0;padding:22px 22px 120px;display:flex;flex-direction:column;gap:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);background-image:var(--glass)}

/* hero */
.hero{position:relative;overflow:hidden;padding:26px 26px 22px;border-radius:var(--r-xl)}
.hero::before{content:"";position:absolute;inset:0;opacity:.9;pointer-events:none;
  background:
   radial-gradient(600px 260px at 88% -30%,rgba(56,189,248,.22),transparent 60%),
   radial-gradient(500px 240px at 8% 130%,rgba(52,211,153,.16),transparent 60%),
   linear-gradient(120deg,rgba(30,58,95,.35),transparent 55%)}
.hero>*{position:relative}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.hero h1{margin:0;font-size:clamp(24px,3vw,32px);font-weight:770;letter-spacing:-.6px;
  text-wrap:balance;line-height:1.08}
.hero .sub{margin-top:7px;color:var(--txt-2);font-size:14.5px}
.hero .sub b{color:var(--txt);font-family:var(--mono);font-weight:700}
.hero-actions{display:flex;gap:9px;flex-wrap:wrap}
.h-btn{height:40px;padding:0 15px;border-radius:11px;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.06);
  border:1px solid var(--line-strong);color:var(--txt);transition:.15s;backdrop-filter:blur(6px)}
.h-btn svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none}
.h-btn:hover{background:rgba(255,255,255,.11);transform:translateY(-1px)}
.h-btn.primary{background:linear-gradient(135deg,var(--cyan),var(--emerald));color:#04121b;border-color:transparent}
.h-btn.primary svg{stroke:#04121b}
.stat-grid{margin-top:20px;display:grid;grid-template-columns:repeat(6,1fr);gap:9px}
.stat{padding:12px 12px 11px;border-radius:var(--r);background:rgba(255,255,255,.035);
  border:1px solid var(--line);transition:.16s;position:relative;overflow:hidden;text-align:left}
.stat:hover{transform:translateY(-2px);border-color:var(--line-strong);background:rgba(255,255,255,.06)}
.stat .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;margin-bottom:9px;font-size:14px}
.stat .n{font-family:var(--mono);font-size:22px;font-weight:700;line-height:1;letter-spacing:-.5px}
.stat .l{font-size:11px;color:var(--txt-2);margin-top:3px;font-weight:550;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .spark{position:absolute;right:8px;bottom:8px;width:34px;height:16px;opacity:.5}

/* feed toolbar */
.feed-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:2px}
.feed-bar h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.2px;display:flex;align-items:center;gap:9px}
.feed-bar h2 .cnt{font-family:var(--mono);font-size:12px;color:var(--txt-3);font-weight:600}
.seg{display:flex;gap:2px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:11px;padding:3px;margin-left:auto}
.seg button{padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--txt-2);transition:.14s}
.seg button.on{background:var(--raise);color:var(--txt);box-shadow:var(--shadow)}
.filter-btn{height:36px;padding:0 13px;border-radius:10px;font-size:12.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;background:var(--panel-2);
  border:1px solid var(--line);color:var(--txt-2);transition:.15s}
.filter-btn svg{width:15px;height:15px;stroke:currentColor;stroke-width:2}
.filter-btn:hover{color:var(--txt);border-color:var(--line-strong)}
.filter-btn.active{color:var(--cyan);border-color:rgba(56,189,248,.4);background:rgba(56,189,248,.08)}

/* horizontal category scroller (mobile mainly) */
.cat-scroll{display:none}

/* article card */
.card{padding:0;overflow:hidden;position:relative;transition:transform .16s,border-color .16s,box-shadow .16s;
  animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.card:hover{transform:translateY(-3px);border-color:var(--line-strong);box-shadow:var(--shadow-lg)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card-in{display:grid;grid-template-columns:1fr 208px;gap:0}
.card-body{padding:17px 18px 15px;min-width:0}
.card-head{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.cat-badge{font-size:11px;font-weight:700;letter-spacing:.3px;padding:4px 9px;border-radius:7px;
  display:inline-flex;align-items:center;gap:6px}
.cat-badge .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.time{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--txt-3);display:flex;align-items:center;gap:5px;white-space:nowrap}
.time .live{width:6px;height:6px;border-radius:50%;background:var(--rose);box-shadow:0 0 8px var(--rose);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.card h3{margin:0 0 4px;font-size:18px;font-weight:700;letter-spacing:-.35px;line-height:1.25;
  text-wrap:balance;cursor:pointer;transition:color .15s}
.card h3:hover{color:var(--cyan)}
.tldr{margin:11px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.tldr .lab,.why .lab{font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--cyan);margin-bottom:2px;display:flex;align-items:center;gap:6px}
.tldr li{position:relative;padding-left:17px;font-size:13.2px;color:var(--txt-2);line-height:1.45}
.tldr li::before{content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;
  background:var(--cyan);opacity:.7}
.why{margin-top:13px;padding:11px 13px;border-radius:12px;
  background:linear-gradient(180deg,rgba(52,211,153,.08),rgba(52,211,153,.02));
  border:1px solid rgba(52,211,153,.16)}
.why .lab{color:var(--emerald)}
.why p{margin:0;font-size:13px;color:var(--txt);line-height:1.5}
.card-media{position:relative;overflow:hidden}
.card-media .img{position:absolute;inset:0}
.card-media .impact{position:absolute;left:12px;bottom:11px;right:12px;z-index:2;
  padding:8px 10px;border-radius:11px;background:rgba(6,9,14,.66);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.12)}
.impact .lab{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.7);font-weight:700}
.bars{display:flex;gap:3px;margin-top:5px}
.bars i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.15)}
.bars i.on{background:linear-gradient(90deg,var(--cyan),var(--emerald));box-shadow:0 0 8px rgba(56,189,248,.5)}
.card-foot{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:12px 18px;border-top:1px solid var(--line);background:rgba(255,255,255,.015)}
.sources{display:flex;align-items:center;gap:5px}
.src{font-size:11px;font-weight:600;color:var(--txt-2);padding:3px 8px;border-radius:7px;
  background:var(--panel-2);border:1px solid var(--line);display:inline-flex;align-items:center;gap:5px}
.src .fav{width:13px;height:13px;border-radius:4px;display:grid;place-items:center;font-size:8px;font-weight:800;color:#fff}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:7px;color:var(--txt-2);
  background:var(--panel-2);border:1px solid var(--line);transition:.14s}
.chip:hover{color:var(--cyan);border-color:rgba(56,189,248,.4)}
.card-tools{margin-left:auto;display:flex;gap:4px}
.tool{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  color:var(--txt-3);transition:.15s;border:1px solid transparent}
.tool svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.9;fill:none}
.tool:hover{color:var(--txt);background:var(--panel-2);border-color:var(--line)}
.tool.on{color:var(--cyan)}
.tool.on svg{fill:var(--cyan);stroke:var(--cyan)}
.tool.saved{color:var(--emerald)}
.tool.saved svg{fill:var(--emerald);stroke:var(--emerald)}

/* ---------- right rail ---------- */
.rail{position:sticky;top:75px;height:calc(100vh - 75px);overflow-y:auto;
  padding:22px 18px 60px;display:flex;flex-direction:column;gap:14px}
.widget{padding:15px 15px 14px;border-radius:var(--r-lg);background:var(--panel);
  border:1px solid var(--line);box-shadow:var(--shadow);background-image:var(--glass)}
.w-head{display:flex;align-items:center;gap:8px;margin-bottom:13px}
.w-head .ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none}
.w-head .ic svg{width:14px;height:14px;stroke-width:2}
.w-head h4{margin:0;font-size:12.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.w-head .more{margin-left:auto;font-size:11px;color:var(--txt-3);font-weight:600;transition:.14s}
.w-head .more:hover{color:var(--cyan)}
.w-head .drag{margin-left:auto;color:var(--txt-3);cursor:grab;display:none}
.trend-row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:10px;transition:.14s}
.trend-row:hover{background:var(--panel-2)}
.trend-row .rk{font-family:var(--mono);font-size:12px;color:var(--txt-3);width:16px;font-weight:700}
.trend-row .nm{font-size:13px;font-weight:550;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trend-row .chg{font-family:var(--mono);font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:3px}
.chg.up{color:var(--up)} .chg.down{color:var(--down)}
.trend-bar{height:4px;border-radius:3px;background:var(--panel-2);margin-top:3px;overflow:hidden}
.trend-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--cyan),var(--emerald))}
.co-row{display:flex;align-items:center;gap:9px;padding:7px 6px;border-radius:10px;transition:.14s}
.co-row:hover{background:var(--panel-2)}
.co-logo{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:800;
  font-size:11px;color:#fff;flex:none}
.co-row .nm{font-size:13px;font-weight:600;flex:1}
.co-row .ct{font-family:var(--mono);font-size:11px;color:var(--txt-3)}
/* timeline */
.tl{position:relative;padding-left:6px}
.tl-row{display:flex;gap:11px;padding:0 0 14px;position:relative}
.tl-row:last-child{padding-bottom:2px}
.tl-time{font-family:var(--mono);font-size:11px;color:var(--txt-3);width:52px;flex:none;padding-top:1px;text-align:right}
.tl-line{position:relative;flex:none;width:14px;display:flex;justify-content:center}
.tl-line::before{content:"";position:absolute;top:5px;bottom:-14px;width:1.5px;background:var(--line)}
.tl-row:last-child .tl-line::before{display:none}
.tl-dot{width:9px;height:9px;border-radius:50%;background:var(--cyan);z-index:1;margin-top:3px;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--cyan) 22%,transparent)}
.tl-txt{font-size:12.5px;color:var(--txt);line-height:1.35;cursor:pointer;transition:.14s}
.tl-txt:hover{color:var(--cyan)}
/* tags cloud */
.cloud{display:flex;flex-wrap:wrap;gap:7px}
.cloud .chip{font-size:12px;padding:5px 10px;cursor:pointer}
/* map */
.map-wrap{position:relative}
.map-svg{width:100%;height:auto;display:block}
.map-region{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:6px 8px;border-radius:9px;transition:.14s}
.map-region:hover{background:var(--panel-2)}
.map-region .ld{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:550}
.map-region .dot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 8px currentColor}
.map-region .rc{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--txt)}
/* watchlist */
.wl-row{display:grid;grid-template-columns:1fr 62px 60px;align-items:center;gap:8px;
  padding:8px 6px;border-radius:10px;transition:.14s}
.wl-row:hover{background:var(--panel-2)}
.wl-name{display:flex;align-items:center;gap:8px;min-width:0}
.wl-name .co-logo{width:22px;height:22px;font-size:9px;border-radius:6px}
.wl-name b{font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl-spark{width:100%;height:26px}
.wl-price{text-align:right;font-family:var(--mono);font-size:12px;font-weight:600}
.wl-chg{font-family:var(--mono);font-size:10.5px;font-weight:600;text-align:right}
.wl-add{margin-top:8px;width:100%;padding:7px;border-radius:9px;border:1px dashed var(--line-strong);
  color:var(--txt-2);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.wl-add:hover{color:var(--emerald);border-color:var(--emerald)}

/* ---------- modal / reading ---------- */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(4,6,10,.66);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;justify-content:center;align-items:flex-start;padding:40px 20px;overflow-y:auto;
  animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:min(860px,100%);background:var(--panel);border:1px solid var(--line-strong);
  border-radius:var(--r-xl);box-shadow:var(--shadow-lg);overflow:hidden;
  animation:pop .28s cubic-bezier(.2,.8,.2,1);margin:auto 0}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.read-hero{position:relative;height:230px;overflow:hidden}
.read-hero .img{position:absolute;inset:0}
.read-hero::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 30%,var(--panel))}
.read-close{position:absolute;top:14px;right:14px;z-index:3;width:38px;height:38px;border-radius:11px;
  background:rgba(6,9,14,.6);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.16);
  display:grid;place-items:center}
.read-close svg{width:18px;height:18px;stroke:#fff;stroke-width:2}
.read-body{padding:0 30px 30px;margin-top:-46px;position:relative;z-index:2}
.read-body .read-head{display:flex;align-items:center;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.read-body h2{margin:0 0 10px;font-size:clamp(22px,3.4vw,30px);font-weight:780;letter-spacing:-.6px;
  line-height:1.14;text-wrap:balance}
.read-meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;color:var(--txt-2);font-size:12.5px;
  padding-bottom:16px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.read-meta .m{display:flex;align-items:center;gap:6px}
.read-meta svg{width:14px;height:14px;stroke:currentColor;stroke-width:2}
.read-sec{margin:22px 0}
.read-sec>.h{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--cyan);margin-bottom:11px;display:flex;align-items:center;gap:8px}
.read-sec.why-sec>.h{color:var(--emerald)}
.read-sec p{margin:0 0 11px;font-size:15px;line-height:1.68;color:var(--txt);max-width:66ch}
.read-sec ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.read-sec ul li{position:relative;padding-left:22px;font-size:14.5px;line-height:1.55;color:var(--txt)}
.read-sec ul li::before{content:"";position:absolute;left:4px;top:9px;width:6px;height:6px;
  border-radius:50%;background:var(--cyan)}
.read-sec.why-sec{padding:16px 18px;border-radius:15px;
  background:linear-gradient(180deg,rgba(52,211,153,.09),rgba(52,211,153,.02));
  border:1px solid rgba(52,211,153,.18)}
.read-tl{display:flex;flex-direction:column;gap:0}
.read-tl .r{display:flex;gap:14px;padding-bottom:16px;position:relative}
.read-tl .r:last-child{padding-bottom:0}
.read-tl .t{font-family:var(--mono);font-size:12px;color:var(--txt-3);width:64px;flex:none;text-align:right}
.read-tl .ln{width:12px;flex:none;position:relative;display:flex;justify-content:center}
.read-tl .ln::before{content:"";position:absolute;top:4px;bottom:-16px;width:1.5px;background:var(--line)}
.read-tl .r:last-child .ln::before{display:none}
.read-tl .d{width:9px;height:9px;border-radius:50%;background:var(--cyan);margin-top:3px;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--cyan) 20%,transparent)}
.read-tl .c{font-size:14px;color:var(--txt);padding-top:1px}
.related{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rel-card{padding:12px;border-radius:13px;background:var(--panel-2);border:1px solid var(--line);
  cursor:pointer;transition:.15s}
.rel-card:hover{border-color:var(--line-strong);transform:translateY(-2px)}
.rel-card .rc-cat{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.rel-card h5{margin:5px 0 0;font-size:13.5px;font-weight:650;line-height:1.3;letter-spacing:-.2px}
.orig-src{display:flex;flex-direction:column;gap:8px}
.orig-src a{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:12px;
  background:var(--panel-2);border:1px solid var(--line);transition:.15s}
.orig-src a:hover{border-color:var(--cyan);transform:translateX(3px)}
.orig-src .fav{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;
  font-size:9px;font-weight:800;color:#fff;flex:none}
.orig-src .nm{font-size:13px;font-weight:600;flex:1}
.orig-src svg{width:15px;height:15px;stroke:var(--txt-3);stroke-width:2}

/* popover panels (filters, personalize, folders) */
.pop{position:fixed;z-index:90;background:var(--panel);border:1px solid var(--line-strong);
  border-radius:var(--r-lg);box-shadow:var(--shadow-lg);padding:16px;width:320px;
  animation:pop .2s cubic-bezier(.2,.8,.2,1)}
.pop h5{margin:0 0 3px;font-size:14px;font-weight:700}
.pop .desc{font-size:11.5px;color:var(--txt-2);margin-bottom:14px}
.pop .grp{margin-bottom:15px}
.pop .grp>label{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  color:var(--txt-3);display:block;margin-bottom:8px}
.opt-wrap{display:flex;flex-wrap:wrap;gap:6px}
.opt{font-size:12px;padding:5px 10px;border-radius:8px;background:var(--panel-2);
  border:1px solid var(--line);color:var(--txt-2);transition:.14s;font-weight:550}
.opt:hover{color:var(--txt);border-color:var(--line-strong)}
.opt.on{background:rgba(56,189,248,.14);color:var(--cyan);border-color:rgba(56,189,248,.4)}
.pop .row{display:flex;gap:8px;margin-top:6px}
.pop-btn{flex:1;padding:9px;border-radius:10px;font-size:12.5px;font-weight:650;transition:.14s}
.pop-btn.ghost{background:var(--panel-2);border:1px solid var(--line);color:var(--txt-2)}
.pop-btn.ghost:hover{color:var(--txt)}
.pop-btn.solid{background:linear-gradient(135deg,var(--cyan),var(--emerald));color:#04121b}
.range{width:100%;accent-color:var(--cyan)}
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;font-size:13px}
.switch{width:38px;height:22px;border-radius:20px;background:var(--panel-2);border:1px solid var(--line);
  position:relative;transition:.18s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:var(--txt-2);transition:.18s}
.switch.on{background:linear-gradient(90deg,var(--cyan),var(--emerald))}
.switch.on::after{left:18px;background:#04121b}

/* search dropdown */
.search-pop{position:absolute;top:54px;left:0;right:0;background:var(--panel);
  border:1px solid var(--line-strong);border-radius:16px;box-shadow:var(--shadow-lg);
  padding:8px;max-height:min(70vh,560px);overflow-y:auto;z-index:50;animation:pop .18s ease}
.sp-sec{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--txt-3);padding:10px 10px 6px;display:flex;align-items:center;gap:6px}
.sp-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;transition:.13s;width:100%;text-align:left}
.sp-item:hover,.sp-item.hi{background:var(--panel-2)}
.sp-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;
  background:var(--panel-2);border:1px solid var(--line)}
.sp-ic svg{width:15px;height:15px;stroke:var(--txt-2);stroke-width:2}
.sp-item .tt{font-size:13px;font-weight:600;flex:1;min-width:0}
.sp-item .tt small{display:block;font-weight:500;color:var(--txt-3);font-size:11px;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-item .kind{font-family:var(--mono);font-size:10px;color:var(--txt-3);
  border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.sp-empty{padding:26px;text-align:center;color:var(--txt-3);font-size:13px}
.sp-recent-x{margin-left:auto;color:var(--txt-3);font-size:11px}

/* toast */
.toast-wrap{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:200;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--panel-2);border:1px solid var(--line-strong);border-radius:12px;
  padding:11px 16px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);
  display:flex;align-items:center;gap:10px;animation:toastIn .3s cubic-bezier(.2,.8,.2,1)}
.toast svg{width:17px;height:17px;stroke:var(--emerald);stroke-width:2.2}
@keyframes toastIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* empty state */
.empty{padding:60px 24px;text-align:center;color:var(--txt-3)}
.empty svg{width:44px;height:44px;stroke:var(--txt-3);stroke-width:1.6;margin-bottom:14px}
.empty b{display:block;color:var(--txt);font-size:16px;margin-bottom:5px;font-weight:650}

/* bottom mobile nav */
.mobile-bar{display:none}
.mobile-menu-btn{display:none}

/* utility bar of category pills used on Bookmarks view */
.folder-tabs{display:flex;gap:8px;flex-wrap:wrap}
.folder-tab{padding:7px 13px;border-radius:10px;font-size:12.5px;font-weight:600;
  background:var(--panel-2);border:1px solid var(--line);color:var(--txt-2);transition:.14s;
  display:flex;align-items:center;gap:7px}
.folder-tab .ct{font-family:var(--mono);font-size:11px;color:var(--txt-3)}
.folder-tab:hover{color:var(--txt);border-color:var(--line-strong)}
.folder-tab.on{background:rgba(56,189,248,.12);color:var(--cyan);border-color:rgba(56,189,248,.35)}

/* ---------- live data components ---------- */
.live-pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;
  font-weight:700;letter-spacing:.8px;padding:3px 9px;border-radius:20px;text-transform:uppercase;flex:none}
.live-pill .d{width:7px;height:7px;border-radius:50%;background:currentColor}
.live-pill.on{color:var(--emerald);background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.3)}
.live-pill.on .d{animation:pulse 1.6s infinite}
.live-pill.demo{color:var(--amber);background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3)}
.qb-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.qb-cell{padding:11px 12px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);
  text-align:left;transition:.15s;cursor:pointer}
.qb-cell:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.qb-cell.sel{border-color:rgba(56,189,248,.55);background:rgba(56,189,248,.08)}
.qb-cell .s{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--txt-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qb-cell .p{font-family:var(--mono);font-size:15.5px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.qb-cell .c{font-family:var(--mono);font-size:11px;font-weight:600;margin-top:1px;font-variant-numeric:tabular-nums}
.chart-panel{padding:16px 16px 12px}
.chart-head{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:12px}
.chart-head .sym{font-size:15.5px;font-weight:750;letter-spacing:-.2px}
.chart-head .px{font-family:var(--mono);font-size:15px;font-weight:700}
.chart-head .chgv{font-family:var(--mono);font-size:12px;font-weight:700}
.rng{display:flex;gap:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:2px;margin-left:auto}
.rng button{padding:4px 11px;border-radius:7px;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--txt-3);transition:.13s}
.rng button.on{background:var(--raise);color:var(--txt);box-shadow:var(--shadow)}
.cc-wrap{position:relative}
.cc-wrap canvas{width:100%;height:300px;display:block;cursor:crosshair}
.cc-hair{position:absolute;top:0;bottom:30px;width:1px;background:var(--line-strong);display:none;pointer-events:none}
.cc-tip{position:absolute;pointer-events:none;background:var(--raise);border:1px solid var(--line-strong);
  border-radius:10px;padding:8px 11px;font-family:var(--mono);font-size:11px;line-height:1.6;
  box-shadow:var(--shadow-lg);z-index:5;display:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.flash-tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.flash-tab{padding:6px 12px;border-radius:9px;font-size:12px;font-weight:650;background:var(--panel-2);
  border:1px solid var(--line);color:var(--txt-2);transition:.14s;display:inline-flex;align-items:center;gap:6px}
.flash-tab .dot{width:7px;height:7px;border-radius:50%;background:var(--tc,var(--cyan))}
.flash-tab:hover{color:var(--txt);border-color:var(--line-strong)}
.flash-tab.on{color:var(--txt);border-color:var(--tc,var(--cyan));background:color-mix(in srgb,var(--tc,var(--cyan)) 10%,transparent)}
.flash-row{display:flex;gap:11px;padding:9px 6px;border-radius:10px;align-items:flex-start;transition:.13s}
.flash-row:hover{background:var(--panel-2)}
.flash-row .t{font-family:var(--mono);font-size:10.5px;color:var(--txt-3);flex:none;width:38px;padding-top:2px;text-align:right}
.flash-row .h{font-size:13px;font-weight:550;line-height:1.42;flex:1;min-width:0}
.flash-row .h a:hover{color:var(--cyan)}
.flash-row .h .fsrc{font-size:10.5px;color:var(--txt-3);margin-top:2px;font-weight:500}
.chip.on-chip{color:var(--cyan);border-color:rgba(56,189,248,.45);background:rgba(56,189,248,.1)}
.unread-dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);
  box-shadow:0 0 8px var(--cyan);display:inline-block;flex:none}
.ls-card .card-body{padding:15px 17px 13px}
.ls-card h3 a{transition:color .15s}
.ls-card h3 a:hover{color:var(--cyan)}
.ls-card.is-read h3 a{color:var(--txt-2)}
.ls-card .bars{width:70px}
.ls-card .bars i{background:var(--panel-2)}
.ls-card .bars i.on{background:linear-gradient(90deg,var(--cyan),var(--emerald))}
.kb-focus{border-color:rgba(56,189,248,.6)!important;
  box-shadow:0 0 0 3px rgba(56,189,248,.22),var(--shadow-lg)!important}
.digest-folder{font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--txt-3);padding:10px 6px 4px}
.refresh-btn{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;
  color:var(--txt-3);border:1px solid var(--line);background:var(--panel-2);transition:.15s}
.refresh-btn:hover{color:var(--cyan);border-color:rgba(56,189,248,.4);transform:translateY(-1px)}
.refresh-btn svg{width:14px;height:14px;stroke-width:2.1}
.refresh-btn.spin svg{animation:rot .9s linear infinite}
.refresh-btn.spin{pointer-events:none;opacity:.7}
@keyframes rot{to{transform:rotate(360deg)}}
.nav-sec-row{display:flex;align-items:center;gap:8px}
.sec-edit{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.6px;color:var(--txt-3);
  padding:2px 8px;border-radius:6px;border:1px solid var(--line);transition:.14s;text-transform:uppercase}
.sec-edit:hover{color:var(--cyan);border-color:rgba(56,189,248,.4)}
.pop input[type="text"],.pop input:not([type]){width:100%;height:38px;padding:0 12px;border-radius:10px;
  background:var(--panel-2);border:1px solid var(--line);color:var(--txt);font-size:13px;margin-bottom:8px}
@media (max-width:860px){
  .qb-grid{grid-template-columns:repeat(2,1fr)}
  .cc-wrap canvas{height:230px}
}

/* ============ responsive ============ */
@media (max-width:1200px){
  :root{--rail-w:0px}
  .app{grid-template-columns:var(--nav-w) minmax(0,1fr)}
  .rail{display:none}
  .stat-grid{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:860px){
  :root{--nav-w:0px}
  .app{grid-template-columns:minmax(0,1fr)}
  .nav{position:fixed;left:0;top:0;z-index:120;width:280px;transform:translateX(-100%);
    transition:transform .28s cubic-bezier(.2,.8,.2,1);background:var(--bg-2);
    box-shadow:var(--shadow-lg)}
  .nav.open{transform:none}
  .nav-scrim{position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.5);backdrop-filter:blur(3px)}
  .mobile-menu-btn{display:grid}
  .top{padding:11px 14px;gap:9px}
  .kbd{display:none}
  .search input{height:44px}
  .brief-btn span{display:none}
  .brief-btn{padding:0 13px}
  .center{padding:16px 13px 96px}
  .hero{padding:20px 18px}
  .stat-grid{grid-template-columns:repeat(3,1fr)}
  .card-in{grid-template-columns:1fr}
  .card-media{height:172px}
  .cat-scroll{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;
    scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
  .cat-scroll::-webkit-scrollbar{display:none}
  .cat-pill{scroll-snap-align:start;white-space:nowrap;padding:8px 14px;border-radius:11px;
    font-size:13px;font-weight:600;background:var(--panel);border:1px solid var(--line);
    color:var(--txt-2);flex:none;display:flex;align-items:center;gap:7px}
  .cat-pill.on{background:linear-gradient(135deg,rgba(56,189,248,.9),rgba(52,211,153,.85));color:#04121b;border-color:transparent}
  .seg{display:none}
  .mobile-bar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;
    z-index:80;padding:9px 8px calc(9px + env(safe-area-inset-bottom));
    background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px);

function sparkline(seed,up,w=60,h=26){
  // deterministic pseudo-random walk
  let x=seed*9301+49297,rnd=()=>{x=(x*9301+49297)%233280;return x/233280;};
  const pts=[];let v=.5;
  for(let i=0;i<16;i++){v+=(rnd()-.5)*.28+(up?.02:-.02);v=Math.max(.08,Math.min(.92,v));pts.push(v);}
  if(up)pts[pts.length-1]=Math.max(...pts); else pts[pts.length-1]=Math.min(...pts);
  const col=up?"#34d399":"#fb7185";
  const step=w/(pts.length-1);
  const line=pts.map((p,i)=>`${(i*step).toFixed(1)},${(h-4-p*(h-8)).toFixed(1)}`).join(" ");
  const ex=(w).toFixed(1),ey=(h-4-pts[pts.length-1]*(h-8)).toFixed(1);
  const id="g"+seed+(up?"u":"d");
  return `<svg class="wl-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".3"/><stop offset="1" stop-color="${col}" stop-opacity="0"/>
    </linearGradient></defs>
    <polyline points="0,${h} ${line} ${ex},${h}" fill="url(#${id})" stroke="none"/>
    <polyline points="${line}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${ex}" cy="${ey}" r="2" fill="${col}"/></svg>`;
}
function sparkFromCloses(vals,up,w=60,h=26){
  if(!vals.length)return "";
  const min=Math.min(...vals),max=Math.max(...vals),rng=max-min||1;
  const col=up?"#34d399":"#fb7185";
  const step=w/((vals.length-1)||1);
  const line=vals.map((v,i)=>`${(i*step).toFixed(1)},${(h-4-(v-min)/rng*(h-8)).toFixed(1)}`).join(" ");
  const ex=w.toFixed(1),ey=(h-4-(vals[vals.length-1]-min)/rng*(h-8)).toFixed(1);
  const id="lq"+Math.round(vals[0]*100)+(up?"u":"d");
  return `<svg class="wl-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".3"/><stop offset="1" stop-color="${col}" stop-opacity="0"/>

    <circle cx="${ex}" cy="${ey}" r="2" fill="${col}"/></svg>`;
}

   LIVE DATA LAYER
   free keyless sources: Yahoo Finance chart API (quotes + OHLC candles) and
   Google News RSS via public CORS proxies, Hacker News Algolia API direct.
   Everything degrades to deterministic demo data with a visible DEMO pill.
   ========================================================================= */
const LIVE={quotes:{},timers:[],okCount:0,failCount:0,netDead:false};
const PROXY=[
  u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u=>`https://corsproxy.io/?url=${encodeURIComponent(u)}`,
];

function cacheGet(k,maxAge){
  try{const o=JSON.parse(localStorage.getItem("tldr_c_"+k)||"null");
    if(o&&Date.now()-o.t<maxAge)return o.v;}catch(_){}
  return null;
}
function cacheSet(k,v){
  try{localStorage.setItem("tldr_c_"+k,JSON.stringify({t:Date.now(),v}));}catch(_){}
}
function fetchTimeout(url,ms){
  const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);
  return fetch(url,{signal:c.signal}).finally(()=>clearTimeout(t));
}
async function fetchLive(url,{direct=false,timeout=8000}={}){
  if(LIVE.netDead)throw new Error("offline");
  const tries=direct?[u=>u,...PROXY]:[...PROXY];
  let err;
  for(const wrap of tries){
    try{
      const r=await fetchTimeout(wrap(url),timeout);
      LIVE.sawNet=true; // any HTTP response proves the network is reachable
      if(!r.ok)throw new Error("HTTP "+r.status);
      const txt=await r.text();
      if(!txt)throw new Error("empty");
      LIVE.okCount++;
      return txt;
    }catch(e){err=e;}
  }
  LIVE.failCount++;
  // Latch offline only when nothing has EVER reached the network —
  // a single endpoint failing must not kill the other feeds.
  if(!LIVE.okCount&&!LIVE.sawNet&&LIVE.failCount>=3)LIVE.netDead=true;
  throw err||new Error("fetch failed");
}
function hashCode(s){let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))|0;return Math.abs(h)||7;}
function genCandles(seed,n,base){
  let x=seed;const rnd=()=>{x=(x*1103515245+12345)%2147483648;return x/2147483648;};
  const arr=[];let prev=base*(0.82+rnd()*0.2);
  for(let i=0;i<n;i++){
    const o=prev,c=o*(1+(rnd()-0.485)*0.028);
    const h=Math.max(o,c)*(1+rnd()*0.009),l=Math.min(o,c)*(1-rnd()*0.009);
    arr.push({t:Date.now()-(n-1-i)*864e5,o,h,l,c,v:5e6+rnd()*3e7});
    prev=c;
  }
  return arr;
}
function demoQuote(sym){
  const base=DEMO_PRICES[sym]||100;
  const candles=genCandles(hashCode(sym),130,base);
  const price=candles[candles.length-1].c,prev=candles[candles.length-2].c;
  return {sym,price,chg:(price-prev)/prev*100,candles,live:false};
}
async function getQuote(sym,{fresh=false}={}){
  const key="q_"+sym;
  if(!fresh){const c=cacheGet(key,15*60e3);if(c){LIVE.quotes[sym]=c;return c;}}
  const url=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?range=6mo&interval=1d`;
  const j=JSON.parse(await fetchLive(url));
  const r=j.chart&&j.chart.result&&j.chart.result[0];
  if(!r||!r.timestamp)throw new Error("bad quote payload");
  const q=r.indicators.quote[0];
  const candles=[];
  r.timestamp.forEach((t,i)=>{
    if(q.open[i]==null||q.close[i]==null||q.high[i]==null||q.low[i]==null)return;
    candles.push({t:t*1000,o:q.open[i],h:q.high[i],l:q.low[i],c:q.close[i],v:(q.volume&&q.volume[i])||0});
  });
  if(!candles.length)throw new Error("no candles");
  const price=r.meta.regularMarketPrice??candles[candles.length-1].c;
  const prev=r.meta.chartPreviousClose??(candles.length>1?candles[candles.length-2].c:price);
  const out={sym,price,chg:prev?(price-prev)/prev*100:0,candles,live:true};
  LIVE.quotes[sym]=out;cacheSet(key,out);
  return out;
}
async function quoteOrDemo(sym,fresh){

async function gnews(q,fresh){
  const key="n_"+q;
  if(!fresh){const c=cacheGet(key,5*60e3);if(c)return c;}
  const url=`https://news.google.com/rss/search?q=${encodeURIComponent(q)}&hl=en-US&gl=US&ceid=US:en`;
  const xml=await fetchLive(url);
  const doc=new DOMParser().parseFromString(xml,"text/xml");
  const items=[...doc.querySelectorAll("item")].slice(0,16).map(it=>{
    let title=it.querySelector("title")?.textContent||"";
    const src=it.getElementsByTagName("source")[0]?.textContent||"";
    if(src&&title.endsWith(" - "+src))title=title.slice(0,-(src.length+3));
    return {title,link:it.querySelector("link")?.textContent||"#",src:src||"News",
      desc:it.querySelector("description")?.textContent||"",
      pub:+new Date(it.querySelector("pubDate")?.textContent||Date.now())};

  if(!items.length)throw new Error("empty rss");
  cacheSet(key,items);

}
function stripHtml(h){
  try{return new DOMParser().parseFromString(h,"text/html").body.textContent||"";}
  catch(_){return String(h).replace(/<[^>]*>/g," ");}
}
function cleanSrc(s){
  return (s||"News").split(/\s+[»|–-]\s+/)[0].trim().slice(0,26);
}
function parseFeed(xml){
  const doc=new DOMParser().parseFromString(xml,"text/xml");
  if(doc.querySelector("parsererror"))throw new Error("bad xml");
  const gt=(node,tag)=>node.getElementsByTagName(tag)[0]?.textContent||"";
  const chTitle=cleanSrc(doc.querySelector("channel>title")?.textContent
    ||doc.getElementsByTagName("feed")[0]?.getElementsByTagName("title")[0]?.textContent||"");
  const rss=[...doc.querySelectorAll("channel>item")];
  if(rss.length)return rss.slice(0,14).map(it=>({
    title:gt(it,"title").trim(),
    link:gt(it,"link").trim()||it.getElementsByTagName("guid")[0]?.textContent||"#",
    desc:gt(it,"description")||it.getElementsByTagName("content:encoded")[0]?.textContent||"",
    pub:+new Date(gt(it,"pubDate")||gt(it,"dc:date")||Date.now()),
    src:chTitle,
  })).filter(x=>x.title);
  const atom=[...doc.querySelectorAll("entry")];
  return atom.slice(0,14).map(e=>({
    title:gt(e,"title").trim(),
    link:e.querySelector('link[rel="alternate"]')?.getAttribute("href")
      ||e.querySelector("link")?.getAttribute("href")||"#",
    desc:gt(e,"summary")||gt(e,"content")||"",
    pub:+new Date(gt(e,"updated")||gt(e,"published")||Date.now()),
    src:chTitle,
  })).filter(x=>x.title);
}
async function fetchFeedCached(url,fresh){
  const key="f_"+url;
  if(!fresh){const c=cacheGet(key,5*60e3);if(c)return c;}
  const items=parseFeed(await fetchLive(url));
  if(!items.length)throw new Error("empty feed");
  cacheSet(key,items);
  return items;
}
function dedupeItems(items){
  const seen=new Set();
  return items.filter(i=>{
    const k=i.title.toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,80);
    if(!k||seen.has(k))return false;
    seen.add(k);return true;
  });
}
const STOPWORDS=new Set(("the a an of to in on for and as at by with its is are was were be has have had "+
  "after over from new up out how what why says said will could would this that it his her their your "+
  "more than into amid about not no you we they he she").split(" "));
function titleTokens(t){

    .filter(w=>w.length>2&&!STOPWORDS.has(w)));
}
/* Group items that are the same story across sources (token overlap). */
function clusterStories(items){
  const clusters=[];
  [...items].sort((a,b)=>b.pub-a.pub).forEach(it=>{
    const ts=titleTokens(it.title);
    let best=null,bestScore=0;
    for(const c of clusters){
      let inter=0;ts.forEach(w=>{if(c.tokens.has(w))inter++;});
      const uni=c.tokens.size+ts.size-inter;
      const j=uni?inter/uni:0;
      const score=Math.max(j,inter>=4?0.5:0,(inter>=3&&j>=0.22)?0.45:0);
      if(score>bestScore){bestScore=score;best=c;}
    }
    if(best&&bestScore>=0.4){best.items.push(it);ts.forEach(w=>best.tokens.add(w));}
    else clusters.push({tokens:new Set(ts),items:[it]});
  });
  return clusters.map(c=>{
    const primary=c.items.reduce((a,b)=>(!a.desc&&b.desc)?b:a,c.items[0]);
    const srcs=[...new Set(c.items.map(i=>cleanSrc(i.src)))];
    return {...primary,pub:Math.max(...c.items.map(i=>i.pub)),
      alts:c.items.filter(i=>i!==primary),srcs,srcCount:srcs.length};
  }).sort((a,b)=>(b.srcCount-a.srcCount)||(b.pub-a.pub));
}
/* Real TL;DR bullets: publisher description sentences, then other sources' angles. */
function toBullets(st){
  let bullets=[];
  if(st.desc){
    const clean=stripHtml(st.desc).replace(/\s+/g," ").trim();
    const tl=st.title.toLowerCase();
    if(clean.length>40){
      bullets=clean.split(/(?<=[.!?])\s+/)
        .map(s=>s.trim())
        .filter(s=>s.length>30&&s.length<260)
        .filter(s=>{const sl=s.toLowerCase();
          return !tl.includes(sl.slice(0,40))&&!sl.includes(tl.slice(0,40));})
        .slice(0,3);
    }
  }
  const room=4-bullets.length;
  if(room>0&&st.alts&&st.alts.length){
    const tl=st.title.toLowerCase();
    st.alts.filter(a=>a.title.toLowerCase()!==tl).slice(0,room)
      .forEach(a=>bullets.push(a.title+" — "+cleanSrc(a.src)));
  }
  return bullets.slice(0,4);
}
function markRead(key){
  if(store.read.includes(key))return;
  store.read.push(key);

function resolveDesk(id){

async function hnNews(q){
  const url=`https://hn.algolia.com/api/v1/search_by_date?query=${encodeURIComponent(q)}&tags=story&hitsPerPage=14`;
  const j=JSON.parse(await fetchLive(url,{direct:true}));
  const items=(j.hits||[]).filter(h=>h.title).map(h=>({
    title:h.title,link:h.url||("https://news.ycombinator.com/item?id="+h.objectID),
    src:"Hacker News",pub:+new Date(h.created_at)}));

function timeAgo(t){
  const s=(Date.now()-t)/1e3;
  if(s<90)return "now";
  if(s<3600)return Math.floor(s/60)+"m";
  if(s<86400)return Math.floor(s/3600)+"h";
  return Math.floor(s/86400)+"d";
}

function fmtVol(v){return v>=1e9?(v/1e9).toFixed(1)+"B":v>=1e6?(v/1e6).toFixed(1)+"M":v>=1e3?(v/1e3).toFixed(0)+"K":String(Math.round(v));}

function activeArticles(){
  let list=ARTICLES.filter(a=>!store.hidden.includes(a.cat));

  if(view.mode==="tag"&&view.tag)list=list.filter(a=>a.tags.includes(view.tag));
  if(view.mode==="bookmarks"){
    list=list.filter(a=>store.bookmarks[a.id]);
    if(view.folder!=="All")list=list.filter(a=>store.bookmarks[a.id]===view.folder);
  }
  if(view.mode==="brief")list=list.filter(a=>a.impact>=4);
  // advanced filters
  const f=view.filters;
  if(f.region)list=list.filter(a=>a.region===f.region);
  if(f.source)list=list.filter(a=>a.sources.includes(f.source));
  if(f.minImpact)list=list.filter(a=>a.impact>=f.minImpact);
  if(f.maxRead)list=list.filter(a=>a.read<=f.maxRead);
  if(f.company)list=list.filter(a=>a.companies.includes(f.company));
  // sort
  if(view.sort==="top")list=[...list].sort((a,b)=>b.impact-a.impact||a.id-b.id);
  else list=[...list].sort((a,b)=>a.id-b.id); // latest ~ by id order (already newest-first)
  return list;
}

    chgEl.style.color=up?"var(--up)":"var(--down)";}
  drawCandles(cv,$("#ccTip"),$("#ccHair"),data);
}
function drawCandles(canvas,tipEl,hairEl,data){
  if(!data.length)return;
  const dpr=window.devicePixelRatio||1;
  const W=canvas.clientWidth||600,H=canvas.clientHeight||300;
  canvas.width=W*dpr;canvas.height=H*dpr;
  const ctx=canvas.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const padL=8,padR=58,padT=12,padB=30,volH=44;
  const plotW=W-padL-padR,priceH=H-padT-padB-volH-10;
  const hi=Math.max(...data.map(d=>d.h)),lo=Math.min(...data.map(d=>d.l));
  const vmax=Math.max(...data.map(d=>d.v))||1;
  const X=i=>padL+plotW*(i+0.5)/data.length;
  const Y=p=>padT+priceH*(1-(p-lo)/(hi-lo||1));
  const css=getComputedStyle(document.documentElement);
  const cUp=css.getPropertyValue("--up").trim()||"#34d399";
  const cDn=css.getPropertyValue("--down").trim()||"#fb7185";
  const cGrid=css.getPropertyValue("--line").trim()||"rgba(255,255,255,.07)";
  const cTxt=css.getPropertyValue("--txt-3").trim()||"#5f6a7d";
  ctx.clearRect(0,0,W,H);
  ctx.font="10px ui-monospace,Menlo,monospace";
  ctx.strokeStyle=cGrid;ctx.fillStyle=cTxt;ctx.lineWidth=1;
  for(let g=0;g<=4;g++){
    const p=lo+(hi-lo)*g/4,y=Y(p);
    ctx.beginPath();ctx.moveTo(padL,y+.5);ctx.lineTo(W-padR,y+.5);ctx.stroke();
    ctx.fillText("$"+fmtPx(p),W-padR+8,y+3);
  }
  ctx.textAlign="center";
  const step=Math.max(1,Math.floor(data.length/5));
  for(let i=0;i<data.length;i+=step){
    const d=new Date(data[i].t);
    ctx.fillText(d.toLocaleDateString(undefined,{month:"short",day:"numeric"}),X(i),H-padB+16);
  }
  ctx.textAlign="left";
  const volTop=padT+priceH+10;
  const bw=Math.max(1.5,plotW/data.length*0.62);
  data.forEach((d,i)=>{
    ctx.globalAlpha=.32;ctx.fillStyle=d.c>=d.o?cUp:cDn;
    const bh=Math.max(1,volH*(d.v/vmax));
    ctx.fillRect(X(i)-bw/2,volTop+volH-bh,bw,bh);
    ctx.globalAlpha=1;
  });
  data.forEach((d,i)=>{
    const col=d.c>=d.o?cUp:cDn;
    ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=1;
    const x=X(i);
    ctx.beginPath();ctx.moveTo(x,Y(d.h));ctx.lineTo(x,Y(d.l));ctx.stroke();
    const yo=Y(d.o),yc=Y(d.c);
    ctx.fillRect(x-bw/2,Math.min(yo,yc),bw,Math.max(1.4,Math.abs(yc-yo)));
  });
  const last=data[data.length-1],ly=Y(last.c),lUp=last.c>=last.o;
  ctx.setLineDash([4,4]);ctx.strokeStyle=lUp?cUp:cDn;
  ctx.beginPath();ctx.moveTo(padL,ly+.5);ctx.lineTo(W-padR,ly+.5);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle=lUp?cUp:cDn;
  ctx.fillRect(W-padR+4,ly-9,padR-8,18);
  ctx.fillStyle="#04121b";
  ctx.fillText("$"+fmtPx(last.c),W-padR+8,ly+3.5);
  canvas.onmousemove=e=>{
    const r=canvas.getBoundingClientRect();
    const rel=(e.clientX-r.left-padL)/plotW;
    const i=Math.min(data.length-1,Math.max(0,Math.floor(rel*data.length)));
    const d=data[i];
    if(!d){if(tipEl)tipEl.style.display="none";if(hairEl)hairEl.style.display="none";return;}
    if(hairEl){hairEl.style.display="block";hairEl.style.left=X(i)+"px";}
    if(tipEl){
      const dt=new Date(d.t).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
      const dUp=d.c>=d.o;
      tipEl.innerHTML=`<b>${dt}</b><br>O $${fmtPx(d.o)} · H $${fmtPx(d.h)}<br>L $${fmtPx(d.l)} · C <span style="color:${dUp?cUp:cDn}">${dUp?"▲":"▼"} $${fmtPx(d.c)}</span><br>Vol ${fmtVol(d.v)}`;
      tipEl.style.display="block";
      tipEl.style.left=Math.min(e.clientX-r.left+14,W-160)+"px";
      tipEl.style.top=Math.max(6,e.clientY-r.top-70)+"px";
    }
  };
  canvas.onmouseleave=()=>{
    if(tipEl)tipEl.style.display="none";
    if(hairEl)hairEl.style.display="none";
  };
}

function worldMap(counts){
  // stylized dotted continents with pulsing hotspots
  const spots=[["USA",58,90,"#38bdf8"],["Europe",150,74,"#a78bfa"],["China",228,96,"#f87171"],
    ["India",205,116,"#fb923c"],["Japan",258,92,"#34d399"]];
  const max=Math.max(1,...Object.values(counts));
  let dots="";
  for(let y=30;y<150;y+=10)for(let x=20;x<300;x+=10){
    // rough landmass mask
    const land=( (x>30&&x<95&&y>55&&y<135) || (x>130&&x<175&&y>50&&y<95) ||
      (x>175&&x<270&&y>60&&y<135) || (x>120&&x<160&&y>100&&y<140) );
    if(land)dots+=`<circle cx="${x}" cy="${y}" r="1.1" fill="currentColor" opacity=".22"/>`;
  }
  let hot=spots.map(([id,x,y,c])=>{
    const v=counts[id]||0;const r=6+ (v/max)*10;
    return `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" opacity=".16"/>
      <circle cx="${x}" cy="${y}" r="3.4" fill="${c}"/>
      <circle cx="${x}" cy="${y}" r="3.4" fill="none" stroke="${c}" opacity=".6">
        <animate attributeName="r" values="3.4;${r+3};3.4" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".6;0;.6" dur="3s" repeatCount="indefinite"/></circle>`;
  }).join("");
  return `<svg class="map-svg" viewBox="0 0 300 170" style="color:var(--txt-2)">${dots}${hot}</svg>`;
}

function popAt(anchor,html,w=320){
  closePop();
  const scrim=el(`<div class="pop-scrim" style="position:fixed;inset:0;z-index:89"></div>`);
  scrim.onclick=closePop;document.body.appendChild(scrim);
  const p=el(`<div class="pop" style="width:${w}px">${html}</div>`);
  document.body.appendChild(p);
  const r=anchor.getBoundingClientRect();
  let left=Math.min(r.left,window.innerWidth-w-14);left=Math.max(14,left);
  let top=r.bottom+8;
  if(top+p.offsetHeight>window.innerHeight-10)top=Math.max(10,r.top-p.offsetHeight-8);
  p.style.left=left+"px";p.style.top=top+"px";

  const renderCC=()=>{
    $("#ccList",p).innerHTML=store.customCats.length

  renderCC();

    const isUrl=/^https?:\/\//i.test(kq);
    store.customCats.push({id:"c"+Date.now(),name,
      mode:isUrl?"feed":"q",q:isUrl?null:kq,url:isUrl?kq:null,
      color:ccColors[store.customCats.length%ccColors.length]});

    const file=e.target.files[0];if(!file)return;
    try{
      const doc=new DOMParser().parseFromString(await file.text(),"text/xml");
      const outlines=[...doc.querySelectorAll("outline[xmlUrl]")].slice(0,12);
      if(!outlines.length){toast("No feeds found in that OPML");return;}
      let added=0;

        if(store.customCats.some(x=>x.url===url))return;

      });
      store.save();renderNav();renderCC();
      toast(added?`Imported ${added} feed${added===1?"":"s"} as desks`:"Those feeds are already followed");
    }catch(_){toast("Couldn't parse that OPML file");}
    e.target.value="";
  };

function buildSearchIndex(){
  const idx=[];
  ARTICLES.forEach(a=>idx.push({kind:"Article",label:a.title,sub:CAT[a.cat].name+" · "+a.time+" ago",ic:I.brief,go:()=>openArticle(a.id),hay:(a.title+" "+a.tldr.join(" ")+" "+a.tags.join(" ")+" "+a.companies.join(" ")+" "+(a.people||[]).join(" ")+" "+a.region).toLowerCase()}));
  CATEGORIES.forEach(c=>idx.push({kind:"Category",label:c.name,sub:catCounts()[c.id]+" stories",ic:I.layers,go:()=>goCat(c.id),hay:c.name.toLowerCase()}));
  const cos=new Set();ARTICLES.forEach(a=>a.companies.forEach(c=>cos.add(c)));
  cos.forEach(c=>idx.push({kind:"Company",label:c,sub:"Company",ic:I.building,go:()=>runSearch(c),hay:c.toLowerCase()}));
  const ppl=new Set();ARTICLES.forEach(a=>(a.people||[]).forEach(p=>ppl.add(p)));
  ppl.forEach(p=>idx.push({kind:"Person",label:p,sub:"Person",ic:I.user,go:()=>runSearch(p),hay:p.toLowerCase()}));
  const tags=new Set();ARTICLES.forEach(a=>a.tags.forEach(t=>tags.add(t)));
  tags.forEach(t=>idx.push({kind:"Tag",label:"#"+t,sub:"Tag",ic:I.tag,go:()=>goTag(t),hay:t.toLowerCase()}));
  REGIONS.forEach(r=>idx.push({kind:"Country",label:r.n,sub:"Region",ic:I.globe,go:()=>{view.filters={region:r.id};go("home");},hay:r.n.toLowerCase()}));
  const tops=new Set();ARTICLES.forEach(a=>a.topics.forEach(t=>tops.add(t)));
  tops.forEach(t=>idx.push({kind:"Topic",label:t,sub:"Topic",ic:I.trend,go:()=>runSearch(t),hay:t.toLowerCase()}));
  return idx;
}
let SEARCH_INDEX=[];
function openSearchPop(q){
  const pop=$("#searchPop");pop.className="search-pop";
  q=q.trim().toLowerCase();
  if(!q){
    let h="";
    if(store.recent.length){
      h+=`<div class="sp-sec">${svg(I.clock,"","width:12px;height:12px")} Recent <button class="sp-recent-x" id="clrRecent">Clear</button></div>`;
      h+=store.recent.slice(0,5).map(r=>`<button class="sp-item" data-recent="${esc(r)}">
        <span class="sp-ic">${svg(I.clock)}</span><span class="tt">${esc(r)}</span></button>`).join("");
    }
    if(store.savedSearch.length){
      h+=`<div class="sp-sec">${svg(I.saved,"","width:12px;height:12px")} Saved</div>`;
      h+=store.savedSearch.map(r=>`<button class="sp-item" data-recent="${esc(r)}">
        <span class="sp-ic">${svg(I.saved)}</span><span class="tt">${esc(r)}</span></button>`).join("");
    }
    h+=`<div class="sp-sec">${svg(I.fire,"","width:12px;height:12px")} Trending</div>`;
    h+=TRENDING_TAGS.slice(0,6).map(t=>`<button class="sp-item" data-recent="${esc(t)}">
      <span class="sp-ic">${svg(I.tag)}</span><span class="tt">#${esc(t)}</span><span class="kind">Tag</span></button>`).join("");
    pop.innerHTML=h;pop.style.display="block";bindSearchPop(pop,[]);
    return;
  }
  const results=SEARCH_INDEX.filter(x=>x.hay.includes(q))
    .sort((a,b)=>a.label.toLowerCase().indexOf(q)-b.label.toLowerCase().indexOf(q)).slice(0,12);
  if(!results.length){pop.innerHTML=`<div class="sp-empty">No matches for “${esc(q)}”.<br><span style="color:var(--txt-3);font-size:12px">Press Enter to search the full feed.</span></div>`;
    pop.style.display="block";return;}
  const groups={};results.forEach(r=>{(groups[r.kind]=groups[r.kind]||[]).push(r);});
  let h="";Object.entries(groups).forEach(([k,arr])=>{
    h+=`<div class="sp-sec">${esc(k)}s</div>`;
    h+=arr.map((r,i)=>`<button class="sp-item" data-ix="${results.indexOf(r)}">
      <span class="sp-ic">${svg(r.ic)}</span>
      <span class="tt">${esc(r.label)}<small>${esc(r.sub)}</small></span>
      <span class="kind">${esc(r.kind)}</span></button>`).join("");
  });
  pop.innerHTML=h;pop.style.display="block";
  bindSearchPop(pop,results);
}
function bindSearchPop(pop,results){
  pop.querySelectorAll("[data-ix]").forEach(b=>b.onclick=()=>{results[+b.dataset.ix].go();closeSearch();});
  pop.querySelectorAll("[data-recent]").forEach(b=>b.onclick=()=>{$("#searchInput").value=b.dataset.recent;runSearch(b.dataset.recent);});
  const clr=$("#clrRecent",pop);if(clr)clr.onclick=(e)=>{e.stopPropagation();store.recent=[];store.save();openSearchPop("");};
}
function closeSearch(){$("#searchPop").style.display="none";$("#searchInput").blur();}
function runSearch(q){
  q=q.trim();if(!q)return;
  if(!store.recent.includes(q)){store.recent.unshift(q);store.recent=store.recent.slice(0,8);store.save();}
  view.mode="search";view.query=q;view.cat=null;view.tag=null;
  closeSearch();
  const list=ARTICLES.filter(a=>{
    const hay=(a.title+" "+a.tldr.join(" ")+" "+a.tags.join(" ")+" "+a.companies.join(" ")+" "+(a.people||[]).join(" ")+" "+a.topics.join(" ")+" "+a.region+" "+CAT[a.cat].name).toLowerCase();
    return hay.includes(q.toLowerCase());
  });
  renderSearchResults(q,list);
  renderNav();
}
function renderSearchResults(q,list){
  const c=$("#center");c.innerHTML="";
  clearLiveTimers();
  const saved=store.savedSearch.includes(q);
  c.appendChild(el(`<div class="feed-bar">
    <h2>Results for “${esc(q)}” <span class="cnt">${list.length} ${list.length===1?'match':'matches'}</span></h2>
    <button class="filter-btn ${saved?'active':''}" id="saveSearchBtn">${svg(saved?I.saved:I.bookmark)}${saved?"Saved":"Save this search"}</button>
  </div>`));
  $("#saveSearchBtn").onclick=()=>{
    if(!store.savedSearch.includes(q)){store.savedSearch.unshift(q);store.save();toast("Search saved");renderNav();$("#saveSearchBtn").classList.add("active");$("#saveSearchBtn").innerHTML=svg(I.saved)+"Saved";}
  };
  if(!list.length){c.appendChild(emptyEl());return;}
  list.forEach((a,i)=>{const card=articleCard(a);card.style.animationDelay=(i*35)+"ms";c.appendChild(card);});
}

/* =========================================================================
   GLOBAL EVENT DELEGATION
   ========================================================================= */
function onClick(e){
  const t=e.target;
  const q=(sel)=>t.closest(sel);

  // nav main
  let n=q("[data-nav]");
  if(n){const m=n.dataset.nav;
    if(m==="bookmarks")go("bookmarks");else if(m==="brief")go("brief");
    else if(m==="saved")go("saved");else if(m==="live")go("live");else go("home");
    if(window.innerWidth<=860)closeNav();return;}

  let cat=q("[data-cat]");
  if(cat){goCat(cat.dataset.cat);if(window.innerWidth<=860)closeNav();return;}

  let ccat=q("[data-ccat]");
  if(ccat){view.mode="ccat";view.ccat=ccat.dataset.ccat;view.cat=null;view.tag=null;
    rerender();renderNav();renderMobileBar();window.scrollTo({top:0,behavior:"smooth"});
    if(window.innerWidth<=860)closeNav();return;}

  let qs=q("[data-qsym]");
  if(qs){MKT.sym=qs.dataset.qsym;
    $$("#qbGrid .qb-cell").forEach(x=>x.classList.toggle("sel",x.dataset.qsym===MKT.sym));
    drawChart();return;}

  let rng=q("[data-rng]");
  if(rng){MKT.range=rng.dataset.rng;
    $$("#ccRng button").forEach(b=>b.classList.toggle("on",b.dataset.rng===MKT.range));
    drawChart();return;}

  let fw=q("[data-fw]");
  if(fw){MKT.topic=fw.dataset.fw;
    $$(".flash-tab").forEach(b=>b.classList.toggle("on",b.dataset.fw===MKT.topic));
    const l=$("#fwList");if(l)l.innerHTML=`<div class="empty" style="padding:26px 20px">${svg(I.bolt)}<b>Pulling headlines…</b></div>`;
    refreshFlash();return;}

  let rf=q("[data-refresh]");
  if(rf){
    LIVE.netDead=false;LIVE.failCount=0; // manual refresh always retries the network
    rf.classList.add("spin");
    const done=()=>rf.classList.remove("spin");
    const kind=rf.dataset.refresh;
    if(kind==="wire")refreshWire(true).finally(done);
    else if(kind==="flash")refreshFlash(true).finally(done);
    else if(kind==="quotes")refreshQuotes(true).then(drawChart).finally(done);
    else done();
    return;}

  let lw=q("[data-lw]");
  if(lw){LW={id:lw.dataset.lw};
    $$("#lwChips .chip").forEach(x=>x.classList.toggle("on-chip",x.dataset.lw===LW.id));
    const l=$("#lwList");if(l)l.innerHTML=`<div class="panel empty">${svg(I.bolt)}<b>Pulling headlines…</b></div>`;
    refreshWire();return;}

  let rl=q("[data-readlink]");
  if(rl){ // let the link open; just record it as read
    markRead(rl.dataset.readlink);
    const card=rl.closest(".ls-card");
    if(card){card.classList.add("is-read");card.querySelectorAll(".unread-dot").forEach(d=>d.remove());}
    return;}

  let mr=q("[data-markread]");
  if(mr){
    if($("#lwList")){
      $$("#lwList [data-link]").forEach(c=>{
        if(c.dataset.link)markRead(c.dataset.link);
        c.classList.add("is-read");
        c.querySelectorAll(".unread-dot").forEach(d=>d.remove());
      });
    }else{
      activeArticles().forEach(a=>markRead("a"+a.id));
      renderCenter();
    }
    toast("All marked as read");return;}

  let tg=q("[data-tag]");
  if(tg){goTag(tg.dataset.tag);return;}

  let untag=q("[data-untag]");
  if(untag){e.stopPropagation();const tag=untag.dataset.untag;
    store.followedTags=store.followedTags.filter(x=>x!==tag);store.save();renderNav();toast("Unfollowed #"+tag);return;}

  let open=q("[data-open]");
  if(open){openArticle(open.dataset.open);return;}

  let bm=q("[data-bm]");
  if(bm){e.stopPropagation();
    if(store.bookmarks[bm.dataset.bm])chooseFolder(bm.dataset.bm,bm);
    else chooseFolder(bm.dataset.bm,bm);return;}

  let sv=q("[data-save]");
  if(sv){e.stopPropagation();const id=+sv.dataset.save;const i=store.saved.indexOf(id);
    if(i>=0){store.saved.splice(i,1);toast("Removed from saved");}else{store.saved.push(id);toast("Saved for later");}
    store.save();sv.classList.toggle("saved");return;}

  let sh=q("[data-share]");
  if(sh){e.stopPropagation();const a=ARTICLES.find(x=>x.id==sh.dataset.share);
    const url=location.href.split("#")[0]+"#article-"+a.id;
    if(navigator.share){navigator.share({title:a.title,url}).catch(()=>{});}
    else{navigator.clipboard?.writeText(url).then(()=>toast("Link copied")).catch(()=>toast("Link: "+url));}
    return;}

  // search-driven widgets
  let s=q("[data-search]");
  if(s){$("#searchInput").value=s.dataset.search;runSearch(s.dataset.search);return;}

  let reg=q("[data-region]");
  if(reg){view.filters={region:reg.dataset.region};go("home");toast("Filtered to "+reg.dataset.region);return;}

  let fol=q("[data-folder]");
  if(fol){view.folder=fol.dataset.folder;renderCenter();return;}

  let rs=q("[data-runsearch]");
  if(rs){$("#searchInput").value=rs.dataset.runsearch;runSearch(rs.dataset.runsearch);return;}
  let ds=q("[data-delsearch]");
  if(ds){store.savedSearch.splice(+ds.dataset.delsearch,1);store.save();renderCenter();renderNav();return;}

  // sort
  let so=q("[data-sort]");
  if(so){view.sort=so.dataset.sort;rerender();return;}

  // hero actions
  let act=q("[data-act]");
  if(act){handleAct(act.dataset.act,act);return;}

  let mb=q("[data-mb]");
  if(mb){handleMobile(mb.dataset.mb);return;}
}
function handleAct(a,anchor){
  if(a==="readbrief"){go("brief");toast("Showing today's high-impact brief");}
  else if(a==="listen"){toast("🔊 Audio brief queued (text-to-speech)");speak();}
  else if(a==="watch"){openWatchSummary();}
  else if(a==="brief"){go("brief");}
  else if(a==="editwatch"){openWatchEditor(anchor);}
}
function handleMobile(id){
  if(id==="home")go("home");
  else if(id==="bookmarks")go("bookmarks");
  else if(id==="search"){$("#searchInput").focus();$("#searchInput").scrollIntoView();openSearchPop("");}
  else if(id==="cats"){openNav();}
  else if(id==="profile"){openPersonalize($(".avatar"));}
}
function speak(){
  try{const a=activeArticles()[0];if(!a||!window.speechSynthesis)return;
    const u=new SpeechSynthesisUtterance(`Top story. ${a.title}. ${a.tldr.join(". ")}`);
    u.rate=1.02;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(_){}
}
function openWatchSummary(){
  const a=activeArticles()[0]||ARTICLES[0];
  const scrim=el(`<div class="scrim" id="scrim"></div>`);
  scrim.appendChild(el(`<div class="sheet" style="max-width:640px">
    <div class="read-hero" style="height:300px">${imgOverlay(a)}
      <button class="read-close" id="readClose">${svg(I.close,"","stroke:#fff")}</button>
      <div style="position:absolute;inset:0;display:grid;place-items:center;z-index:2">
        <button class="h-btn primary" style="height:56px;width:56px;border-radius:50%;padding:0" id="playSum">${svg(I.play,"","width:26px;height:26px;stroke:#04121b")}</button>
      </div>
      <div style="position:absolute;left:20px;bottom:16px;right:20px;z-index:2">
        <div class="cat-badge" style="background:${a.accent}30;color:#fff;margin-bottom:8px"><span class="d"></span>Video Summary</div>
        <div style="font-size:18px;font-weight:700;text-wrap:balance">${esc(a.title)}</div>
      </div></div>
    <div class="read-body" style="margin-top:16px">
      <div class="read-sec"><div class="h">${svg(I.play,"","width:13px;height:13px;stroke:var(--cyan)")} 60-Second Brief</div>
      <ul>${a.tldr.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>
    </div></div>`));
  document.body.appendChild(scrim);document.body.style.overflow="hidden";
  $("#readClose").onclick=closeSheet;
  scrim.addEventListener("click",e=>{if(e.target===scrim)closeSheet();});
  $("#playSum").onclick=()=>{speak();toast("▶ Playing audio summary");};
}

/* nav open/close (mobile) */
function openNav(){$("#nav").classList.add("open");
  if(!$("#navScrim")){const s=el(`<div class="nav-scrim" id="navScrim"></div>`);s.onclick=closeNav;document.body.appendChild(s);}}
function closeNav(){$("#nav").classList.remove("open");$("#navScrim")?.remove();}

/* =========================================================================
   INIT
   ========================================================================= */
function init(){
  document.documentElement.setAttribute("data-theme",store.theme);
  if(store.density==="compact")document.documentElement.style.setProperty("--r-lg","14px");
  SEARCH_INDEX=buildSearchIndex();
  renderNav();renderCenter();renderRail();renderMobileBar();

  document.addEventListener("click",onClick);

  // search input
  const si=$("#searchInput");
  si.addEventListener("focus",()=>openSearchPop(si.value));
  si.addEventListener("input",()=>openSearchPop(si.value));
  si.addEventListener("keydown",e=>{
    if(e.key==="Enter"){if(si.value.trim())runSearch(si.value);}
    if(e.key==="Escape"){closeSearch();si.blur();}
  });
  document.addEventListener("click",e=>{
    if(!e.target.closest(".search"))$("#searchPop").style.display="none";
  });

  // top buttons
  $("#filterTopBtn").onclick=()=>openFilters($("#filterTopBtn"));
  $("#notifBtn").onclick=()=>openNotifs($("#notifBtn"));
  $("#briefBtn").onclick=()=>go("brief");
  $("#addTagBtn").onclick=()=>openAddTag($("#addTagBtn"));
  $("#catEditBtn").onclick=()=>openCatEditor($("#catEditBtn"));

  // live data: hydrate watchlist quotes; redraw chart on resize
  refreshWatchQuotes();
  let rsT;window.addEventListener("resize",()=>{clearTimeout(rsT);rsT=setTimeout(()=>{if($("#ccCanvas"))drawChart();},200);});
  $("#menuBtn").onclick=openNav;
  $(".avatar").onclick=()=>openPersonalize($(".avatar"));
  $("#themeToggle").onclick=()=>setTheme(store.theme==="dark"?"light":"dark");

  // feed filter (delegated fallback)
  document.addEventListener("click",e=>{
    if(e.target.closest("#feedFilter"))openFilters(e.target.closest("#feedFilter"));
  });

  // keyboard shortcuts
  document.addEventListener("keydown",e=>{
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();si.focus();openSearchPop(si.value);}
    if(e.key==="Escape"){closeSheet();closePop();closeNav();}
  });
  // j/k feed navigation, Enter open, b bookmark, r refresh
  document.addEventListener("keydown",e=>{
    const tag=e.target.tagName;
    if(tag==="INPUT"||tag==="TEXTAREA"||e.metaKey||e.ctrlKey||e.altKey)return;
    if($("#scrim")||$(".pop"))return;
    if(e.key==="r"){const rb=$("[data-refresh]");if(rb){e.preventDefault();rb.click();}return;}
    const cards=$$("#center .card, #lwList .card");
    if(!cards.length)return;
    if(e.key==="j"||e.key==="k"){
      e.preventDefault();
      kbIdx=e.key==="j"?Math.min(cards.length-1,kbIdx+1):Math.max(0,kbIdx-1);
      cards.forEach((c,i)=>c.classList.toggle("kb-focus",i===kbIdx));
      cards[kbIdx].scrollIntoView({block:"center",behavior:"smooth"});
      return;
    }
    if(kbIdx<0||kbIdx>=cards.length)return;
    const c=cards[kbIdx];
    if(e.key==="Enter"){
      e.preventDefault();
      if(c.dataset.id)openArticle(c.dataset.id);
      else if(c.dataset.link&&c.dataset.link!=="#"){
        markRead(c.dataset.link);
        c.classList.add("is-read");
        c.querySelectorAll(".unread-dot").forEach(d=>d.remove());
        window.open(c.dataset.link,"_blank","noopener");
      }
    }else if(e.key==="b"&&c.dataset.id){
      const btn=c.querySelector("[data-bm]");if(btn)btn.click();
    }
  });

  // deep link
  if(location.hash.startsWith("#article-")){const id=location.hash.split("-")[1];if(id)setTimeout(()=>openArticle(id),300);}
}
document.addEventListener("DOMContentLoaded",init);
</script>
